<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RutaReparto</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%232563eb'/%3E%3Cpath fill='%23fff' d='M112 160h208v144H112z'/%3E%3Cpath fill='%2393c5fd' d='M320 208h64l48 56v40H320z'/%3E%3Ccircle cx='176' cy='328' r='36' fill='%230f172a' stroke='%23fff' stroke-width='12'/%3E%3Ccircle cx='368' cy='328' r='36' fill='%230f172a' stroke='%23fff' stroke-width='12'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --card-hover: #334155;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --border: #334155;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      body {
        background: var(--bg);
        color: var(--text);
        padding-bottom: 70px;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 8px 10px;
      }
      .search-box {
        position: relative;
        margin-bottom: 8px;
      }
      .search-input-wrap {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      input[type="text"],
      input[type="time"],
      input[type="number"] {
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
      }
      input[type="text"] {
        flex: 1;
        min-width: 0;
      }
      input:focus {
        border-color: var(--primary);
      }
      .btn-top-compact {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--text);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-top: 4px;
        max-height: 240px;
        overflow-y: auto;
        z-index: 1001;
        box-shadow: 0 10px 25px #0008;
        display: none;
      }
      .result-item {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        font-size: 0.9rem;
      }
      .result-item:last-child {
        border: 0;
      }
      .result-item:hover {
        background: var(--card-hover);
      }
      .result-sub {
        font-size: 0.75rem;
        color: var(--muted);
        display: block;
        margin-top: 2px;
      }
      .map-wrapper {
        position: relative;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
        margin-bottom: 8px;
      }
      #map {
        height: 440px;
        width: 100%;
        transition: height 0.25s ease;
      }
      #map.expanded {
        height: 78vh;
      }
      .map-controls {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .map-btn {
        background: #0f172ae6;
        color: white;
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }
      .route-options {
        background: var(--card);
        padding: 8px 10px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 0.82rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .route-options label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .time-settings {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .time-settings input {
        padding: 4px 6px;
        font-size: 0.82rem;
        background: #0f172a;
      }
      .time-settings input[type="number"] {
        width: 48px;
        text-align: center;
      }
      .actions-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 10px;
      }
      .btn {
        padding: 11px;
        border: 0;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: white;
      }
      .btn-primary {
        background: var(--primary);
      }
      .btn-success {
        background: var(--success);
      }
      .btn-warning {
        background: var(--warning);
        color: #0f172a;
      }
      .btn-danger {
        background: var(--danger);
      }
      .btn-secondary {
        background: var(--card);
        border: 1px solid var(--border);
      }
      .btn-full {
        grid-column: span 2;
      }
      .summary-bar {
        background: #172554;
        border: 1px solid #1d4ed8;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        font-weight: 600;
        flex-wrap: wrap;
        gap: 6px;
      }
      .stop-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .stop-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition:
          transform 0.15s,
          opacity 0.2s,
          border-color 0.2s;
        user-select: none;
      }
      .stop-card.done {
        opacity: 0.5;
        border-color: var(--success);
      }
      .stop-card.is-start {
        border-color: var(--warning);
      }
      .stop-card.dragging {
        opacity: 0.85;
        border: 2px dashed var(--primary);
        background: #273549;
        transform: scale(1.01);
        z-index: 50;
      }
      .stop-card.drag-over {
        border-top: 3px solid var(--warning);
      }
      .stop-header {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .drag-handle {
        color: var(--muted);
        font-size: 1.2rem;
        line-height: 1;
        padding: 4px;
        cursor: grab;
        touch-action: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stop-num {
        background: var(--primary);
        color: white;
        min-width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
        margin-top: 2px;
      }
      .stop-card.done .stop-num {
        background: var(--success);
      }
      .stop-card.is-start .stop-num {
        background: var(--warning);
        color: #0f172a;
      }
      .stop-info {
        flex: 1;
        min-width: 0;
      }
      .stop-title {
        font-weight: 700;
        font-size: 0.95rem;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .stop-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
        align-items: center;
      }
      .badge-time {
        font-size: 0.74rem;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: 600;
        background: #334155;
        color: #e2e8f0;
      }
      .badge-eta-ok {
        background: #10b98133;
        color: #34d399;
        border: 1px solid #10b98166;
      }
      .badge-eta-wait {
        background: #f59e0b33;
        color: #fbbf24;
        border: 1px solid #f59e0b66;
      }
      .badge-eta-late {
        background: #ef444433;
        color: #f87171;
        border: 1px solid #ef444466;
      }
      .stop-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        border-top: 1px solid var(--border);
        padding-top: 8px;
      }
      .btn-sm {
        padding: 7px 9px;
        font-size: 0.82rem;
        border-radius: 6px;
        border: 0;
        font-weight: 600;
        cursor: pointer;
        color: white;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .btn-nav {
        background: var(--success);
        flex: 1;
        justify-content: center;
        font-size: 0.9rem;
      }
      .btn-icon {
        background: var(--card-hover);
        padding: 7px 9px;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: #000d;
        z-index: 2000;
        padding: 16px;
        overflow-y: auto;
      }
      .modal-content {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        max-width: 500px;
        margin: 30px auto;
        padding: 16px;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .saved-search-wrap {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .saved-search-wrap input {
        width: 100%;
        padding: 9px 12px;
        font-size: 0.9rem;
      }
      .saved-item {
        background: var(--card);
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .form-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .form-group {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .form-group label {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .form-group input {
        width: 100%;
        font-size: 0.95rem;
        padding: 10px 8px;
      }
      .gm-stop-pin {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2563eb;
        color: #fff;
        border: 2px solid #fff;
        font-weight: 800;
        font-size: 12px;
        box-shadow: 0 2px 5px #0008;
      }
      .gm-stop-pin.start {
        background: #f59e0b;
        color: #0f172a;
      }
      .gm-gps-pin {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #10b981;
        border: 2px solid #fff;
        font-size: 16px;
        box-shadow: 0 0 10px #10b981;
      }
      @media (max-width: 420px) {
        .stop-header {
          gap: 5px;
        }
        .btn-sm {
          padding: 7px;
        }
        .form-row {
          gap: 5px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="search-box">
        <div class="search-input-wrap">
          <input type="text" id="search-input" placeholder="Buscar negocio, calle o pegar coords..." autocomplete="off" />
          <button class="btn-top-compact" onclick="clearSearch()" title="Limpiar búsqueda">✕</button>
          <button class="btn-top-compact" onclick="openSavedModal()">⭐ <span id="saved-count">0</span></button>
        </div>
        <div id="search-results"></div>
      </div>
      <div class="map-wrapper">
        <div id="map"></div>
        <div class="map-controls">
          <button class="map-btn" onclick="toggleMapSize()" id="size-btn">⛶ Ampliar</button>
          <button class="map-btn" onclick="toggleMapLayer()" id="layer-btn">🛰️ Satélite</button>
          <button class="map-btn" onclick="locateUser(true)">📍 Mi GPS</button>
        </div>
      </div>
      <div class="route-options">
        <label><input type="checkbox" id="start-from-gps" checked /> Salir desde GPS</label>
        <div class="time-settings">
          <span>Salida:</span><input type="time" id="departure-time" /><span title="Minutos estimados por cada descarga"
            >Descarga:</span
          ><input type="number" id="service-mins" value="10" min="0" max="120" /><span>m</span>
        </div>
      </div>
      <div class="actions-grid">
        <button class="btn btn-primary btn-full" onclick="optimizeRoute()" id="btn-optimize">
          ⚡ ORDENAR RUTA ÓPTIMA (<span id="stop-count">0</span>)
        </button>
        <button class="btn btn-warning btn-full" onclick="recalculateCurrentOrder()" id="btn-recalc" style="display: none">
          🔄 Recalcular este orden manual
        </button>
        <button class="btn btn-secondary" onclick="clearAllStops()">🗑️ Limpiar lista</button>
        <button class="btn btn-secondary" onclick="fitMapToStops()">🔍 Ver todas</button>
      </div>
      <div class="summary-bar" id="summary-bar" style="display: none">
        <span>🏁 <strong id="total-dist">0 km</strong></span
        ><span>⏱️ Conduc.: <strong id="total-time">0 min</strong></span
        ><span>🏁 Fin est.: <strong id="end-time">--:--</strong></span>
      </div>
      <div class="stop-list" id="stop-list"></div>
    </div>

    <div class="modal" id="time-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🕒 Horario y tiempo de entrega</h3>
          <button class="btn-sm btn-danger" onclick="closeTimeModal()">✕</button>
        </div>
        <p id="time-modal-title" style="font-size: 0.9rem; font-weight: 600; margin-bottom: 10px"></p>
        <p style="font-size: 0.78rem; color: var(--muted); margin-bottom: 12px">
          Rellena solo lo necesario. Si dejas "Descarga" vacío, usará el valor general (10 min).
        </p>
        <div class="form-row">
          <div class="form-group"><label>Desde las:</label><input type="time" id="modal-time-from" /></div>
          <div class="form-group"><label>Hasta las:</label><input type="time" id="modal-time-to" /></div>
          <div class="form-group" style="max-width: 90px">
            <label>Descarga (m):</label><input type="number" id="modal-service-mins" placeholder="10" min="0" max="180" />
          </div>
        </div>
        <div style="display: flex; gap: 8px">
          <button class="btn btn-primary" style="flex: 1" onclick="saveStopTime()">Guardar</button
          ><button class="btn btn-secondary" onclick="clearStopTime()">Limpiar</button>
        </div>
      </div>
    </div>

    <div class="modal" id="saved-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>⭐ Clientes Guardados</h3>
          <button class="btn-sm btn-danger" onclick="closeSavedModal()">Cerrar</button>
        </div>
        <div class="saved-search-wrap">
          <input
            type="text"
            id="saved-search-input"
            placeholder="🔍 Filtrar clientes por nombre o zona..."
            oninput="renderSavedList()"
            autocomplete="off" /><button
            class="btn-sm btn-secondary"
            onclick="
              document.getElementById('saved-search-input').value = '';
              renderSavedList();
            ">
            ✕
          </button>
        </div>
        <div id="saved-list" style="margin-bottom: 16px; max-height: 55vh; overflow-y: auto"></div>
        <div style="border-top: 1px solid var(--border); padding-top: 12px; display: flex; gap: 8px; flex-wrap: wrap">
          <button class="btn-sm btn-primary" onclick="exportBackup()">💾 Exportar copia (.json)</button>
          <label class="btn-sm btn-secondary" style="cursor: pointer"
            >📂 Cargar copia<input type="file" accept=".json" onchange="importBackup(event)" style="display: none"
          /></label>
        </div>
      </div>
    </div>

    <script>
      /*
  RUTAREPARTO + GOOGLE MAPS / PLACES NEW
  Sustituye TU_CLAVE_API por tu clave en tu copia local.
  No compartas la clave. Restringe la clave por HTTP referrer y por API en Google Cloud.
*/
      const GOOGLE_MAPS_API_KEY = "AIzaSyBWhw9aDdCDn8FhpzbeTvgKkXC9ZqHTmuo";
      const BBOX = { west: -2.45, south: 37.35, east: 0.35, north: 38.95 };
      const CENTER_DEFAULT = { lat: 38.15, lng: -0.85 };
      let map, AdvancedMarkerElement, PinElement, placesLib;
      let markersLayer = [];
      let routeLine = null,
        gpsMarker = null,
        infoWindow = null;
      let stops = JSON.parse(localStorage.getItem("reparto_stops") || "[]");
      let savedClients = JSON.parse(localStorage.getItem("reparto_saved") || "[]");
      let userCoords = null,
        isSatellite = false,
        editingTimeIndex = null,
        needsManualRecalc = false;
      let autocompleteSessionToken = null,
        searchTimeout = null,
        searchRequestId = 0;
      const searchInput = document.getElementById("search-input");
      const searchResults = document.getElementById("search-results");

      function setNowDeparture() {
        const n = new Date();
        document.getElementById("departure-time").value =
          `${String(n.getHours()).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}`;
      }
      setNowDeparture();

      function loadGoogleMapsApi() {
        return new Promise((resolve, reject) => {
          if (window.google && window.google.maps && window.google.maps.importLibrary) {
            resolve();
            return;
          }
          const script = document.createElement("script");
          script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GOOGLE_MAPS_API_KEY)}&v=weekly&loading=async`;
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("No se pudo cargar Google Maps JavaScript API."));
          document.head.appendChild(script);
        });
      }
      async function initGoogleMaps() {
        if (!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY === "AIzaSyBWhw9aDdCDn8FhpzbeTvgKkXC9ZqHTmuo") {
          document.getElementById("map").innerHTML =
            '<div style="padding:20px;color:#fff">Falta introducir la clave API de Google Maps en el código.</div>';
          return;
        }
        try {
          await loadGoogleMapsApi();
          const { Map } = await google.maps.importLibrary("maps");
          const markerLib = await google.maps.importLibrary("marker");
          placesLib = await google.maps.importLibrary("places");
          AdvancedMarkerElement = markerLib.AdvancedMarkerElement;
          PinElement = markerLib.PinElement;
          map = new Map(document.getElementById("map"), {
            center: CENTER_DEFAULT,
            zoom: 9,
            mapId: "DEMO_MAP_ID",
            mapTypeId: "roadmap",
            streetViewControl: false,
            mapTypeControl: false,
            fullscreenControl: false,
            gestureHandling: "greedy",
          });
          infoWindow = new google.maps.InfoWindow();
          map.addListener("click", (e) => {
            if (!e.latLng) return;
            const lat = Number(e.latLng.lat().toFixed(6)),
              lng = Number(e.latLng.lng().toFixed(6));
            const defaultName = `Punto mapa (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
            const name = prompt("Nombre para esta parada (ej. Nave 4, Cliente...):", defaultName);
            if (name !== null && name.trim()) addStop(name.trim(), lat, lng);
          });
          saveAndRender();
          locateUser(true);
        } catch (err) {
          console.error("Google Maps:", err);
          document.getElementById("map").innerHTML =
            '<div style="padding:20px;color:#fff">No se pudo cargar Google Maps. Comprueba la clave, la facturación y las restricciones de la API. Consulta la consola del navegador para ver el error.</div>';
        }
      }
      function makeMarkerContent(number, isStart = false) {
        const el = document.createElement("div");
        el.className = "gm-stop-pin" + (isStart ? " start" : "");
        el.textContent = String(number);
        return el;
      }
      function removeAllStopMarkers() {
        markersLayer.forEach((m) => (m.map = null));
        markersLayer = [];
      }
      function clearRouteLine() {
        if (routeLine) {
          routeLine.setMap(null);
          routeLine = null;
        }
      }
      function toggleMapSize() {
        const el = document.getElementById("map"),
          btn = document.getElementById("size-btn");
        el.classList.toggle("expanded");
        btn.textContent = el.classList.contains("expanded") ? "🗕 Reducir" : "⛶ Ampliar";
        setTimeout(() => {
          if (map) google.maps.event.trigger(map, "resize");
        }, 280);
      }
      function toggleMapLayer() {
        if (!map) return;
        isSatellite = !isSatellite;
        map.setMapTypeId(isSatellite ? "hybrid" : "roadmap");
        document.getElementById("layer-btn").textContent = isSatellite ? "🗺️ Mapa" : "🛰️ Satélite";
      }
      function locateUser(centerMap = false) {
        if (!navigator.geolocation) return;
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            if (gpsMarker) gpsMarker.map = null;
            const el = document.createElement("div");
            el.className = "gm-gps-pin";
            el.textContent = "🚚";
            gpsMarker = new AdvancedMarkerElement({
              map,
              position: { lat: userCoords[0], lng: userCoords[1] },
              content: el,
              title: "Tu ubicación actual",
            });
            if (centerMap && map) (map.setCenter({ lat: userCoords[0], lng: userCoords[1] }), map.setZoom(15));
          },
          (err) => console.warn("Error GPS:", err),
          { enableHighAccuracy: true, timeout: 8000 },
        );
      }
      function parseGoogleCoords(text) {
        const match = text.trim().match(/^(-?\d{1,2}[.,]\d+)\s*[,;\s]\s*(-?\d{1,3}[.,]\d+)$/);
        if (!match) return null;
        const lat = parseFloat(match[1].replace(",", ".")),
          lng = parseFloat(match[2].replace(",", "."));

          card.className = `stop-card ${s.done ? "done" : ""} ${s.isStart ? "is-start" : ""}`;
          card.dataset.index = i;
          card.innerHTML = `<div class="stop-header"><div class="drag-handle" title="Arrastrar para reordenar">⋮⋮</div><div class="stop-num">${i + 1}</div><div class="stop-info"><div class="stop-title"></div><div class="stop-meta">${meta ? `<span class="badge-time">${meta}</span>` : ""}${eta}</div></div><button class="btn-sm btn-icon" title="Horario y tiempo de descarga" onclick="openTimeModal(${i})">🕒</button><button class="btn-sm btn-icon" title="Fijar como punto de salida" onclick="setAsStart(${i})">🚩</button><button class="btn-sm btn-icon" title="Guardar en clientes habituales" onclick="saveClient(${i})">⭐</button></div><div class="stop-actions"><a href="${url}" target="_blank" rel="noopener" class="btn-sm btn-nav">🧭 Ir (Maps)</a><button class="btn-sm ${s.done ? "btn-secondary" : "btn-primary"}" onclick="toggleDone(${i})">${s.done ? "↩️ Deshacer" : "✓ Entregado"}</button><button class="btn-sm btn-icon" onclick="moveStop(${i},-1)">↑</button><button class="btn-sm btn-icon" onclick="moveStop(${i},1)">↓</button><button class="btn-sm btn-danger" onclick="removeStop(${i})">✕</button></div>`;
          const title = card.querySelector(".stop-title");
          title.textContent = s.name + (s.isStart ? " (SALIDA)" : "");
          if (s.isStart)
            title.insertAdjacentHTML("beforeend", ' <span style="color:var(--warning);font-size:.75rem">(SALIDA)</span>');
          // Reemplazar el texto añadido antes para evitar duplicar la etiqueta
          if (s.isStart) title.textContent = s.name;
          card.querySelector(".stop-title").appendChild(document.createTextNode(s.isStart ? " (SALIDA)" : ""));
          list.appendChild(card);
          attachDragEvents(card, card.querySelector(".drag-handle"), i);
        });
      }
      function saveClient(index) {
        const s = stops[index],
          name = prompt("Guardar cliente habitual como:", s.name);
        if (!name || !name.trim()) return;
        savedClients.push({
          name: name.trim(),
          lat: s.lat,
          lng: s.lng,
          timeFrom: s.timeFrom || "",
          timeTo: s.timeTo || "",
          serviceMins: s.serviceMins || "",
        });
        localStorage.setItem("reparto_saved", JSON.stringify(savedClients));
        saveAndRender();
        alert("Cliente (con su horario y tiempo) guardado en tu lista ⭐");
      }
      function openSavedModal() {
        document.getElementById("saved-search-input").value = "";
        renderSavedList();
        document.getElementById("saved-modal").style.display = "block";
      }
      function closeSavedModal() {
        document.getElementById("saved-modal").style.display = "none";
      }
      function renderSavedList() {
        const box = document.getElementById("saved-list"),
          term = document.getElementById("saved-search-input").value.trim().toLowerCase();
        box.innerHTML = "";
        if (!savedClients.length) {
          box.innerHTML =
            '<p style="color:var(--muted);font-size:.9rem">Aún no tienes clientes guardados. Pulsa la ⭐ en cualquier parada para guardarla.</p>';
          return;
        }
        const filtered = savedClients.map((c, i) => ({ c, i })).filter((x) => x.c.name.toLowerCase().includes(term));
        if (!filtered.length) {
          box.innerHTML = '<p style="color:var(--muted);font-size:.9rem">Ningún cliente coincide con esa búsqueda.</p>';
          return;
        }
        filtered.forEach(({ c, i }) => {
          const div = document.createElement("div");
          div.className = "saved-item";
          const info = document.createElement("div");
          info.style.flex = "1";
          info.style.fontSize = ".9rem";
          const strong = document.createElement("strong");
          strong.textContent = c.name;
          info.appendChild(strong);
          const w = formatMetaLabels(c.timeFrom, c.timeTo, c.serviceMins);
          if (w) {
            const small = document.createElement("div");
            small.style.cssText = "font-size:.75rem;color:var(--muted);margin-top:2px";
            small.textContent = w;
            info.appendChild(small);
          }
          div.append(info);
          const add = document.createElement("button");
          add.className = "btn-sm btn-success";
          add.textContent = "+ Ruta";
          add.onclick = () => addSavedToRoute(i);
          const del = document.createElement("button");
          del.className = "btn-sm btn-danger";
          del.textContent = "✕";
          del.onclick = () => deleteSaved(i);
          div.append(add, del);
          box.appendChild(div);
        });
      }
      function addSavedToRoute(i) {
        const c = savedClients[i];
        addStop(c.name, c.lat, c.lng, c.timeFrom, c.timeTo, c.serviceMins);
        closeSavedModal();
      }
      function deleteSaved(i) {
        savedClients.splice(i, 1);
        localStorage.setItem("reparto_saved", JSON.stringify(savedClients));
        renderSavedList();
        saveAndRender();
      }
      function exportBackup() {
        const data = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(savedClients, null, 2)),
          a = document.createElement("a");
        a.href = data;
        a.download = `clientes_reparto_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
      }
      function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (Array.isArray(data)) {
              savedClients = data;
              localStorage.setItem("reparto_saved", JSON.stringify(savedClients));
              renderSavedList();
              saveAndRender();
              alert("Copia restaurada correctamente.");
            } else throw new Error();
          } catch (err) {
            alert("Archivo de copia no válido.");
          }
        };
        reader.readAsText(file);
        event.target.value = "";
      }

      initGoogleMaps();
    </script>
  </body>
</html>
